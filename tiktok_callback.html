<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok 連携</title>
<style>body{font-family:-apple-system,sans-serif;background:#f6f1e7;color:#1f2a44;text-align:center;padding:60px 16px}
button{font-size:20px;padding:16px 36px;border-radius:12px;border:0;background:#1f2a44;color:#fff}p{line-height:1.8}</style>
<h1>TikTok と連携</h1>
<p id="m">下のボタンを押すと、Mac のターミナルが自動で受け取ります。</p>
<button id="b">コピー</button>
<script>
const q=new URLSearchParams(location.search),c=q.get("code"),s=q.get("state")||"";
if(!c){document.getElementById("m").textContent="許可されませんでした："+(q.get("error_description")||q.get("error")||"");document.getElementById("b").hidden=true}
document.getElementById("b").onclick=async()=>{await navigator.clipboard.writeText("TTCODE:"+c+"|"+s);document.getElementById("m").textContent="受け取りました。このページは閉じて大丈夫です。"};
</script>
